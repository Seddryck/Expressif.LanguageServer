name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: .NET 10 / win-x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install GitVersion
        shell: pwsh
        run: dotnet tool install --global GitVersion.Tool

      - name: Calculate version
        id: version
        shell: pwsh
        run: |
          $version = dotnet-gitversion /showvariable SemVer
          if (-not $version) { throw 'GitVersion did not return a semantic version.' }
          "semver=$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

          $releaseEligible = $false
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main') {
            $existingTag = git tag --list "v$version"
            $releaseEligible = -not $existingTag
          }
          "release-eligible=$($releaseEligible.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Propagate version to VS Code extension
        run: npm version ${{ steps.version.outputs.semver }} --prefix vscode-extension --no-git-tag-version --allow-same-version

      - name: Restore
        run: dotnet restore Expressif.LanguageServer.sln -r win-x64

      - name: Build
        run: dotnet build src/Expressif.LanguageServer/Expressif.LanguageServer.csproj --configuration Release --framework net10.0 --runtime win-x64 --no-restore --nologo -p:Version=${{ steps.version.outputs.semver }}

      - name: Test core services
        run: dotnet test src/Expressif.LanguageServer.Core.Tests/Expressif.LanguageServer.Core.Tests.csproj --configuration Release --framework net10.0 --runtime win-x64 --no-restore --nologo

      - name: Publish self-contained application
        run: dotnet publish src/Expressif.LanguageServer/Expressif.LanguageServer.csproj --configuration Release --framework net10.0 --runtime win-x64 --self-contained true --no-restore --nologo -p:Version=${{ steps.version.outputs.semver }} --output artifacts/publish

      - name: Install VS Code extension dependencies
        run: npm ci --prefix vscode-extension

      - name: Package VS Code extension
        shell: pwsh
        run: |
          $server = 'vscode-extension/server/win-x64'
          New-Item -ItemType Directory -Force -Path $server | Out-Null
          Copy-Item -Path 'artifacts/publish/*' -Destination $server -Recurse -Force

          npm run compile --prefix vscode-extension
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Push-Location vscode-extension
          try {
            npx vsce package --out "../artifacts/Expressif-LanguageSupport-$env:VERSION-win-x64.vsix"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Create release archive
        shell: pwsh
        run: |
          $archive = "artifacts/Expressif-LanguageServer-$env:VERSION-net10.0-win-x64.zip"
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $archive

      - name: Upload VS Code extension package
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-${{ steps.version.outputs.semver }}-win-x64
          path: artifacts/Expressif-LanguageSupport-${{ steps.version.outputs.semver }}-win-x64.vsix
          if-no-files-found: error

      - name: Upload release candidate
        if: steps.version.outputs.release-eligible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: |
            artifacts/Expressif-LanguageServer-${{ steps.version.outputs.semver }}-net10.0-win-x64.zip
            artifacts/Expressif-LanguageSupport-${{ steps.version.outputs.semver }}-win-x64.vsix
          if-no-files-found: error
          retention-days: 1

    outputs:
      version: ${{ steps.version.outputs.semver }}
      release-eligible: ${{ steps.version.outputs.release-eligible }}

  release:
    name: GitHub Release
    needs: build-test-publish
    if: needs.build-test-publish.outputs.release-eligible == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release candidate
        uses: actions/download-artifact@v7
        with:
          name: release-candidate
          path: artifacts

      - name: Tag and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-test-publish.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $archive = "artifacts/Expressif-LanguageServer-$env:VERSION-net10.0-win-x64.zip"
          $extension = "artifacts/Expressif-LanguageSupport-$env:VERSION-win-x64.vsix"
          gh release create $tag $archive $extension --repo '${{ github.repository }}' --target '${{ github.sha }}' --title $tag --generate-notes
